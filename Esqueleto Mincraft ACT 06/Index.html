<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <title>Personaje Minecraft - Esqueleto</title>
</head>
<body>

    <main class="contenedor" id="menu_personaje">
        <div class="personaje-esqueleto">
            <!-- Cabeza -->
            <div class="cabeza">
                <div class="ojo-izq"></div>
                <div class="ojo-der"></div>
                <div class="boca"></div>
            </div>
            <!-- Cuello -->
            <div class="cuello"></div>
            <!-- Torso y Costillas -->
            <div class="torso">
                <div class="costilla top"></div>
                <div class="costilla mid"></div>
                <div class="columna"></div>
            </div>
            <!-- Brazos -->
            <div class="brazo-izq"></div>
            <div class="brazo-der"></div>
            <!-- Cadera -->
            <div class="cadera"></div>
            <!-- Piernas -->
            <div class="piernas-container">
                <div class="pierna-izq"></div>
                <div class="pierna-der"></div>
            </div>
        </div>
    </main>

</body>
</html>
